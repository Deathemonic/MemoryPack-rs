[package]
name = "memorypack-rust-tests"

version.workspace = true
edition.workspace = true

publish = false

[dev-dependencies]
memorypack = { workspace = true, features = ["extended_types"] }

chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
glam = { version = "0.29", features = ["serde", "fast-math"] }
half = { version = "2.7", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-complex = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.39", features = ["serde"] }
rust_decimal_macros = "1.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde"] }

[lints]
workspace = true
