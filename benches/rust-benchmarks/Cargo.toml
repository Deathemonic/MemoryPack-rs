[package]
name = "memorypack-benchmark"

version = "0.0.1"
edition.workspace = true

publish = false

[features]
arena = ["memorypack/bumpalo", "dep:bumpalo"]
dhat-heap = ["dhat"]
mimalloc = ["memorypack/mimalloc"]

[dependencies]
bumpalo = { workspace = true, optional = true }
memorypack = { workspace = true }

dhat = { workspace = true, optional = true }

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "memorypack_bench"
harness = false

[lints]
workspace = true

[[example]]
name = "memorypack_arena"
required-features = ["arena"]
