[package]
name = "memorypack"
description = "A binary wire compatible rust implementation of Cysharp/MemoryPack"

version.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

readme = "../../README.md"
keywords = ["serialize", "deserialize", "binary", "memorypack"]
categories = ["encoding", "parsing"]

[features]
default = ["derive", "serde"]
derive = ["memorypack-derive"]
extended_types = [
    "uuid",
    "rust_decimal",
    "rust_decimal_macros",
    "half",
    "num-bigint",
    "jiff",
    "glam",
    "num-complex",
    "url",
]
hashbrown = ["dep:hashbrown"]
ahash = ["dep:ahash"]
fxhash = ["dep:rustc-hash"]

[dependencies]
memorypack-derive = { workspace = true, optional = true }

ahash = { version = "0.8", features = ["compile-time-rng"], optional = true }
byteorder = { version = "1.5.0", features = ["i128"] }
jiff = { version = "0.2", optional = true }
glam = { version = "0.33", optional = true, features = ["serde", "fast-math"] }
half = { version = "2.7", optional = true, features = ["serde"] }
hashbrown = { version = "0.17", features = ["serde"], optional = true }
num-bigint = { version = "0.5", optional = true, features = ["serde"] }
num-complex = { version = "0.4", optional = true, features = ["serde"] }
rust_decimal = { version = "1.42", optional = true, features = ["serde"] }
rust_decimal_macros = { version = "1.40", optional = true }
rustc-hash = { version = "2.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
simdutf8 = "0.1.5"
thiserror = { workspace = true }
url = { version = "2.5", optional = true, features = ["serde"] }
uuid = { version = "1.25", optional = true, features = ["serde"] }

[dev-dependencies]
eyre = "0.6"
rust_decimal_macros = "1.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
